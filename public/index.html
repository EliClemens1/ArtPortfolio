<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artist Portfolio</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Open+Sans:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="details_styles.css">
  <link rel="stylesheet" href="form_styles.css">

</head>

<body>

  <div id="app">

    <login-page v-if="currentPage === 'login'" @login="loginSuccess"></login-page>

    <main-page v-if="currentPage === 'main'" @open-details="openDetails" @open-upload="openUpload"></main-page>

    <details-page v-if="currentPage === 'details'" :artwork="selectedArtwork" @back="currentPage = 'main'"  @open-edit="openEdit"></details-page>
    
    <edit-page v-if="currentPage === 'edit'" :artwork="selectedArtwork" @back="currentPage = 'details'" ></edit-page>

    <upload-page v-if="currentPage === 'upload'" @upload-complete="returnToMain" @back="returnToMain"></upload-page>





  </div>

  <!-- Load Vue -->
  <script src="https://unpkg.com/vue@3"></script>

  <!-- Load the app module -->
  <script type="module" src="Js/app.js"></script>
  <!-- Load Firebase -->

</body>

</html>
