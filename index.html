<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artist Portfolio</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="details_styles.css">

</head>

<body>

<div id="app">

    <login-page v-if="currentPage === 'login'" @login="loginSuccess"></login-page>

    <main-page v-if="currentPage === 'main'" @open-details="openDetails"></main-page>

    <details-page v-if="currentPage === 'details'" :artwork="selectedArtwork" @back="currentPage = 'main'"></details-page>




</div>

<!-- Load Vue -->
<script src="https://unpkg.com/vue@3"></script>

<!-- Load the app module -->
<script type="module" src="js/app.js"></script>
